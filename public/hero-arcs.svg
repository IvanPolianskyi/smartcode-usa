<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" fill="none" aria-hidden="true">
  <defs>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="line" x1="0.15" y1="0.1" x2="1" y2="0.9">
      <stop offset="0%" stop-color="#c44bff" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#b24bff" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#9d00ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7a00c8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Concentric ellipses — center off the right edge (matches reference vortex) -->
  <g filter="url(#neon)" stroke="url(#line)" stroke-width="1.6" opacity="0.95">
    <ellipse cx="820" cy="520" rx="70" ry="95"/>
    <ellipse cx="820" cy="520" rx="115" ry="155"/>
    <ellipse cx="820" cy="520" rx="165" ry="220"/>
    <ellipse cx="820" cy="520" rx="220" ry="290"/>
    <ellipse cx="820" cy="520" rx="280" ry="365"/>
    <ellipse cx="820" cy="520" rx="345" ry="445"/>
    <ellipse cx="820" cy="520" rx="415" ry="530"/>
    <ellipse cx="820" cy="520" rx="490" ry="620"/>
    <ellipse cx="820" cy="520" rx="570" ry="715"/>
  </g>
</svg>
